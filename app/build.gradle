plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'androidx.navigation.safeargs'
}

// Release signing: prefer a local keystore.properties (developer machine), fall back to
// env vars (CI, see .github/workflows/android-ci.yml). Neither present -> release build
// stays unsigned, same as before, but now that's an explicit, visible choice.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def envKeystoreFile = System.getenv("KEYSTORE_FILE")
def envKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
def envKeyAlias = System.getenv("KEY_ALIAS")
def envKeyPassword = System.getenv("KEY_PASSWORD")
def hasEnvSigningConfig = envKeystoreFile && envKeystorePassword && envKeyAlias && envKeyPassword
def hasReleaseSigningConfig = hasKeystoreProperties || hasEnvSigningConfig
if (!hasReleaseSigningConfig) {
    logger.warn("WARNING: no keystore.properties and no KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD env vars found - release build will be UNSIGNED and cannot be uploaded to Play Console.")
}

android {
    namespace 'com.cynorra.kpssarena'
    compileSdk 36
    defaultConfig {
        applicationId "com.cynorra.kpssarena"
        minSdk 24
        targetSdk 36
        // CI'da her calistirmada benzersiz/artan bir versionCode uretir (GITHUB_RUN_NUMBER),
        // yerel gelistirme build'lerinde 1'de kalir. Play Console her yuklemede kesinlikle
        // artan bir versionCode ister; sabit deger ikinci yuklemede reddedilirdi.
        versionCode (System.getenv("GITHUB_RUN_NUMBER") as Integer) ?: 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            adMobAppId: "ca-app-pub-4674211063760769~8751127091"
        ]
    }
    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(hasKeystoreProperties ? keystoreProperties['storeFile'] : envKeystoreFile)
                storePassword hasKeystoreProperties ? keystoreProperties['storePassword'] : envKeystorePassword
                keyAlias hasKeystoreProperties ? keystoreProperties['keyAlias'] : envKeyAlias
                keyPassword hasKeystoreProperties ? keystoreProperties['keyPassword'] : envKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    hilt {
        enableAggregatingTask = true
    }
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}
dependencies {
    // Material Design 3 & AndroidX
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    
    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    
    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
    
    // Hilt
    implementation 'com.google.dagger:hilt-android:2.59.2'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.59.2'

    // Hilt + WorkManager
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    annotationProcessor 'androidx.hilt:hilt-compiler:1.2.0'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // ViewPager2 dots indicator (onboarding)
    implementation 'com.tbuonomo:dotsindicator:5.1.0'


    // Firebase BOM
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    
    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-rxjava3:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    
    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // MPAndroidChart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    
    // AdMob
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    
    // UMP Consent SDK
    implementation 'com.google.android.ump:user-messaging-platform:3.0.0'
    
    // Lottie
    implementation 'com.airbnb.android:lottie:6.4.0'
    
    // Timber
    implementation 'com.jakewharton.timber:timber:5.0.1'
    
    // Shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    
    
    // ViewPager2

    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    
    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // CircleImageView
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    
    // RxJava3 (for Room & async operations)
    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    
    // Preferences DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Google Fonts
    implementation 'androidx.core:core-google-shortcuts:1.1.0'

    // --- Unit tests ---
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    // --- Instrumented tests ---
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
