name: Weekly Question Generation
on:
  schedule:
    # Her Pazartesi 03:00 UTC (06:00 Turkiye saati)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'Kaç yeni soru üretilsin'
        required: false
        default: '40'
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      - name: Decode Firestore service account
        run: echo "${{ secrets.FIRESTORE_SERVICE_ACCOUNT_B64 }}" | base64 --decode > scripts/serviceAccountKey.json
      - name: Generate and upload questions
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generateQuestions.js "${{ github.event.inputs.count || '40' }}"
      - name: Clean up credentials
        if: always()
        run: rm -f scripts/serviceAccountKey.json
