name: Weekly Question Generation
on:
  schedule:
    # Her Pazartesi 03:00 UTC (06:00 Turkiye saati)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'Kaç yeni soru üretilsin'
        required: false
        default: '40'
      model:
        description: 'Gemini model'
        required: false
        default: 'gemini-2.5-flash'
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      - name: Decode Firestore service account
        run: echo "${{ secrets.FIRESTORE_SERVICE_ACCOUNT_B64 }}" | base64 --decode > scripts/serviceAccountKey.json
      - name: Generate questions (review mode, nothing written to Firestore)
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.model || 'gemini-2.5-flash' }}
        run: node generateQuestions.js "${{ github.event.inputs.count || '40' }}"
      - name: Upload generated questions for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-questions
          path: scripts/generated/*.json
          if-no-files-found: error
      - name: Clean up credentials
        if: always()
        run: rm -f scripts/serviceAccountKey.json
